name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege, and explicit rather than inherited: the `changes` job
# below calls the GitHub API to diff a PR, and if it fails for a
# permissions reason every downstream job would skip, which branch
# protection counts as passing (safety review, #267 finding B).
permissions:
  contents: read
  pull-requests: read

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Per-app path filtering (#267): each app's job only runs when its own
  # tree, or something shared that could affect any of them, changed, so a
  # docs-only PR runs nothing and a single-app PR doesn't pay for the other
  # two apps. Job-level `if:`, not a workflow-level `on.paths` filter, on
  # purpose: with `on.paths`, a PR that doesn't match never triggers the
  # workflow at all, so a required status check for that job never reports
  # and the PR gets stuck on "expected, waiting for status". With a job-level
  # `if:`, the workflow always triggers and the job reports as skipped,
  # which GitHub treats as a passing required check.
  changes:
    name: Determine changed apps
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared: &shared
              - '.github/**'
              - '.pre-commit-config.yaml'
              - 'docker-compose.yml'
              # Designated shared-code home. Empty today, but a filter that
              # silently stops covering it the day someone uses it is the
              # kind of gap nobody notices (safety review, #267 finding C).
              - 'packages/**'
            backend:
              - *shared
              - 'apps/api/**'
              # tests/test_rubric.py reads this file from OUTSIDE apps/api
              # and pins its sha256, because the rubric is frozen
              # (CLAUDE.md rule 4). Without this line a docs-only rubric
              # edit runs no jobs at all, goes green, and turns main red on
              # merge, where the tempting fix is bumping the pinned hash
              # rather than running the evals. Verified: changing one word
              # in that doc fails test_rubric_matches_doc_verbatim
              # (safety review, #267 finding A).
              - 'docs/02-product/severity-rubric-v1.md'
            mobile:
              - *shared
              - 'apps/mobile/**'
            web:
              - *shared
              - 'apps/web/**'

  backend:
    name: backend (lint, type, test)
    needs: changes
    # `always()` plus a result check, not a bare output test: if the
    # `changes` job itself fails or is cancelled, its outputs are empty,
    # `== 'true'` is false, this job reports `skipped`, and branch
    # protection counts a skipped required check as PASSING. Zero tests
    # would run and the PR would go green. Failing open on the gate is
    # the silence direction, so an unhealthy gate now runs the job
    # (safety review, #267 finding B).
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    # Postgres for the Alembic migration step and the integration tests
    # (DB via this service). Unit tests don't touch it.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: stoop
          POSTGRES_USER: stoop
          POSTGRES_PASSWORD: stoop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stoop -d stoop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      # Integration tests will connect here once they exist; unit tests use the
      # placeholder env set in tests/conftest.py.
      DATABASE_URL: postgresql+asyncpg://stoop:stoop@localhost:5432/stoop

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv (with cache)
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # Cheap checks first so CI fails fast.
      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy app

      - name: Alembic migrate
        run: uv run alembic upgrade head

      - name: Pytest
        run: uv run pytest -m "not eval"

  mobile:
    name: mobile (type, lint, test)
    needs: changes
    # `always()` plus a result check, not a bare output test: if the
    # `changes` job itself fails or is cancelled, its outputs are empty,
    # `== 'true'` is false, this job reports `skipped`, and branch
    # protection counts a skipped required check as PASSING. Zero tests
    # would run and the PR would go green. Failing open on the gate is
    # the silence direction, so an unhealthy gate now runs the job
    # (safety review, #267 finding B).
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.mobile == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v6

      # apps/mobile is a self-contained npm package (own package-lock.json,
      # no workspace linkage to apps/web or the repo root), so installing here
      # doesn't touch or disturb the backend job.
      - name: Set up Node (with npm cache)
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Cheap checks first so CI fails fast.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Jest
        run: npx jest

  web:
    name: web (lint, type, build)
    needs: changes
    # `always()` plus a result check, not a bare output test: if the
    # `changes` job itself fails or is cancelled, its outputs are empty,
    # `== 'true'` is false, this job reports `skipped`, and branch
    # protection counts a skipped required check as PASSING. Zero tests
    # would run and the PR would go green. Failing open on the gate is
    # the silence direction, so an unhealthy gate now runs the job
    # (safety review, #267 finding B).
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v6

      - name: Cache bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Cheap checks first so CI fails fast. No dedicated test runner yet
      # (apps/web has no test suite, see #234 and #267); build compiles every
      # route through Vite/TanStack Start's SSR bundler, which does catch
      # some real bugs (unresolved imports, JSX errors) on top of lint/tsc.
      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build
